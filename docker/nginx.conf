server {
    listen 80;
    server_name _;

    root /app/web/dist;
    index index.html;

    client_max_body_size 20M;

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User-uploaded content
    location /uploads/ {
        alias /app/api/uploads/;
    }

    # Backend static files (logos, fonts, programme PDF) are already reachable
    # via the /api/ proxy above (FastAPI mounts them at /assets internally,
    # so /api/assets/... already works) — no alias needed here. A bare
    # /assets/ alias would collide with Vite's own build output folder
    # (web/dist/assets/), which is where the app's own JS/CSS bundles live,
    # and silently 404 every page load.

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }
}
